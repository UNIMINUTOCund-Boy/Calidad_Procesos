<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00b86e"><title>Calidad con corazón · SGC y atención al usuario</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--mint:#1ef0a0;--mint2:#00cf7c;--pale:#e8fff4;--ink:#0c3a2d;--ink2:#35695a;--blue:#1668e3;--yel:#ffd400;--red:#e5483f;--line:#b9f5d9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#00b86e;color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
button,select,input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#shell{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:236px 1fr;gap:clamp(10px,2vw,26px);padding:clamp(8px,2vw,24px);max-width:1380px;margin:0 auto;height:100vh;height:100dvh}
#rail{color:#fff;display:flex;flex-direction:column;gap:6px;min-height:0;overflow-y:auto;padding-right:4px}
#rail img.lg{width:100%;max-width:200px;margin:2px 0 12px}
.st{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;font-weight:700;font-size:15px;text-align:left;color:#fff;opacity:.55;transition:.25s;width:100%}
.st i{font-style:normal;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:14px;flex:none}
.st.ok{opacity:1}.st.ok i{background:var(--yel);color:var(--ink)}
.st.cur{background:#fff;color:var(--ink);opacity:1;box-shadow:0 8px 20px rgba(0,60,40,.25)}
.st.cur i{background:var(--mint);color:var(--ink)}
.st:disabled{cursor:not-allowed}
#panel{background:#fff;border-radius:28px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 20px 60px rgba(0,60,40,.35)}
#top{display:flex;align-items:center;gap:12px;padding:12px clamp(14px,2.5vw,32px) 8px;flex:none}
#top .ttl{flex:1;font-weight:800;color:var(--ink2);font-size:13px;letter-spacing:.14em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud{display:flex;gap:8px}
.hud b{background:var(--pale);border:1.5px solid var(--line);padding:5px 12px;border-radius:99px;font-size:14px;white-space:nowrap}
#mlogo{display:none;height:26px}
#view{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px clamp(16px,3.2vw,44px) 26px;opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity .4s,transform .4s,visibility 0s .4s}
.scr.on{opacity:1;visibility:visible;transform:none;transition:opacity .4s,transform .4s}
#nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px clamp(14px,2.5vw,32px) calc(12px + env(safe-area-inset-bottom));border-top:1.5px solid var(--line);flex:none}
#nav small{color:var(--ink2);font-weight:700}
.btn{white-space:nowrap;background:linear-gradient(135deg,var(--mint),var(--mint2));color:#04281c;font-weight:800;padding:13px 26px;border-radius:14px;font-size:16px;box-shadow:0 6px 16px rgba(0,200,120,.35);transition:.2s;min-height:46px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--pale);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.pulse:not(:disabled){animation:pul 1.4s infinite}
@keyframes pul{50%{box-shadow:0 0 0 10px rgba(30,240,160,.35)}}
.kick{font-weight:800;letter-spacing:.16em;font-size:12px;color:var(--mint2);text-transform:uppercase}
h1{font-size:clamp(34px,6vw,70px);line-height:1;font-weight:900;color:var(--ink);letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--mint2),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(25px,3.4vw,42px);font-weight:900;line-height:1.08;margin:4px 0 8px}
h3{font-size:clamp(17px,1.9vw,22px);font-weight:800}
p.lead{font-size:clamp(15px,1.5vw,18px);line-height:1.55;color:var(--ink2);max-width:760px}
.vig{position:relative;background:linear-gradient(135deg,var(--pale),#fff);border:1.5px solid var(--line);border-radius:22px;padding:18px 20px;margin:12px 0;overflow:hidden}
.vig .bear{float:right;height:clamp(120px,19vw,210px);margin:-6px -6px 0 14px;shape-outside:margin-box;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.vig p{font-size:clamp(15px,1.55vw,18px);line-height:1.6}
.vig q{display:block;font-weight:800;font-size:clamp(17px,2vw,22px);color:var(--ink);margin:8px 0 2px;quotes:none}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin-bottom:6px;text-transform:uppercase}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.fld{display:grid;gap:5px;margin:8px 0}
.fld label{font-weight:800;font-size:13px;color:var(--ink2)}
.fld input,.fld select{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;color:var(--ink);width:100%;outline:none;min-height:48px}
.fld input:focus,.fld select:focus{border-color:var(--mint2)}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.pause{display:flex;align-items:center;gap:14px;margin:12px 0}
.pause .heart{font-size:44px;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;font-size:clamp(14px,1.5vw,17px);line-height:1.35;transition:.2s;min-height:48px}
.opt:active{transform:scale(.99)}
.opt.ok{background:var(--mint);border-color:var(--mint2)}
.opt.bad{background:#ffe3e0;border-color:var(--red);animation:shake .4s}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opts{display:grid;gap:9px;margin:10px 0}
.q{font-size:clamp(17px,2vw,24px);font-weight:800;line-height:1.3;margin:6px 0}
.fb{font-size:15px;line-height:1.5;color:var(--ink2);min-height:24px;margin-top:6px}
.fb b{color:var(--ink)}
.prog{height:10px;border-radius:9px;background:var(--pale);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--blue));transition:width .5s}
/* match / buckets */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin:12px 0}
.mt button{padding:12px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:clamp(13px,1.45vw,16px);line-height:1.3;min-height:56px;transition:.2s}
.mt button.sel{border-color:var(--blue);background:#e8f0ff}
.mt button.done{background:var(--mint);border-color:var(--mint2)}
.mt button.bad{background:#ffe3e0;border-color:var(--red);animation:shake .4s}
.bk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.bk.b3{grid-template-columns:repeat(3,1fr)}
.bin{border:2px dashed var(--mint2);border-radius:16px;padding:10px;min-height:120px;background:var(--pale);text-align:center;transition:.2s;width:100%}
.bin.hot{background:#d3ffe9;border-style:solid}
.bin h4{font-size:14px;font-weight:800;color:var(--ink)}
.bin small{display:block;color:var(--ink2);font-size:12px;margin-bottom:6px}
.bin .ch{display:block;background:#fff;border:1.5px solid var(--mint2);border-radius:10px;padding:6px 8px;font-size:12.5px;font-weight:700;margin-top:6px;text-align:left}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;min-height:54px}
.pool button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;font-size:clamp(13px,1.4vw,15px);text-align:left;max-width:100%;transition:.2s;line-height:1.3}
.pool button.sel{border-color:var(--blue);background:#e8f0ff;transform:translateY(-2px)}
/* flip */
.flip{perspective:900px;cursor:pointer;min-height:118px}
.flip .in{position:relative;height:100%;min-height:118px;transition:transform .6s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;border:1.5px solid var(--line);background:#fff}
.flip .fb2{transform:rotateY(180deg);background:linear-gradient(160deg,var(--mint),#7dffc9);font-size:13.5px;line-height:1.35;font-weight:600}
.flip .fa b{font-size:15px}.flip .fa small{color:var(--ink2);font-size:12px}
.flip.seen .fa::after{content:"✓";position:absolute;right:12px;top:8px;color:var(--mint2);font-weight:900}
/* meters */
.meters{display:grid;gap:10px;margin:12px 0}
.mtr{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-weight:700;font-size:14px}
.mtr .bar{height:16px;border-radius:99px;background:var(--pale);border:1.5px solid var(--line);overflow:hidden}
.mtr .bar i{display:block;height:100%;width:50%;border-radius:99px;transition:width .8s,background .4s}
.res{background:var(--pale);border-left:6px solid var(--mint2);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.5}
.res.warn{background:#fff3e0;border-color:#ff9a2e}
/* lights */
.lights{display:flex;gap:10px;margin:8px 0 2px;flex-wrap:wrap}
.lt{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#1a2b26;filter:grayscale(1) brightness(.6);transition:.4s}
.lt.on{filter:none;background:#ff9a2e;box-shadow:0 0 18px #ff9a2e;animation:blink 1.2s infinite}
.lt.ok{filter:none;background:var(--mint);box-shadow:0 0 14px var(--mint);animation:none}
@keyframes blink{50%{opacity:.55}}
/* swipe */
.deck{position:relative;min-height:190px;margin:12px 0}
.sc{background:linear-gradient(160deg,#fff,var(--pale));border:2px solid var(--mint2);border-radius:22px;padding:22px 20px;text-align:center;font-weight:800;font-size:clamp(18px,2.4vw,26px);line-height:1.3;box-shadow:0 10px 24px rgba(0,100,70,.15);animation:pop .35s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.sc small{display:block;font-weight:600;font-size:14px;color:var(--ink2);margin-top:10px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two button{padding:16px;border-radius:16px;font-weight:900;font-size:17px;border:2px solid;min-height:56px}
.two .h{background:var(--mint);border-color:var(--mint2)}.two .e{background:#ffe3e0;border-color:var(--red)}
.prom{display:grid;gap:8px;margin:10px 0}
.prom button{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.35;min-height:52px;transition:.2s}
.prom button.on{background:var(--mint);border-color:var(--mint2)}
.prom button::before{content:"";width:22px;height:22px;border-radius:7px;border:2px solid var(--mint2);background:#fff;flex:none}
.prom button.on::before{background:var(--ink);border-color:var(--ink);content:"✓";color:#fff;display:grid;place-items:center;font-size:14px}
/* final */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:12px 0}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:var(--pale);border:1.5px solid var(--line);opacity:.4;filter:grayscale(1);transition:.5s}
.badge.on{opacity:1;filter:none;box-shadow:0 0 18px rgba(30,240,160,.7);background:#fff}
.badge span{font-size:30px;display:block}.badge small{font-size:12px;font-weight:800}
.chain{display:flex;align-items:center;justify-content:center;margin:10px 0;flex-wrap:nowrap}
.chain i{font-style:normal;width:clamp(34px,8vw,58px);height:clamp(34px,8vw,58px);border-radius:50%;display:grid;place-items:center;background:var(--pale);border:3px solid var(--line);font-size:clamp(16px,3.4vw,26px);filter:grayscale(1);opacity:.5;transition:.5s}
.chain i.on{filter:none;opacity:1;background:var(--mint);border-color:var(--mint2);box-shadow:0 0 14px var(--mint)}
.chain b{width:clamp(6px,2vw,18px);height:4px;background:var(--line)}
.bars{display:grid;gap:8px;margin:10px 0}
.brow{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.brow .bar{height:14px;border-radius:99px;background:var(--pale);border:1px solid var(--line);overflow:hidden}
.brow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:99px;transition:width 1s}
#certimg{width:100%;max-width:820px;border-radius:14px;border:1.5px solid var(--line);box-shadow:0 10px 30px rgba(0,80,50,.25);display:block;margin:8px 0}
.fly{position:fixed;font-size:26px;z-index:50;pointer-events:none;animation:fly 1.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-170px) scale(1.5);opacity:0}}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,30px);background:var(--ink);color:#fff;font-weight:800;padding:12px 22px;border-radius:99px;z-index:60;opacity:0;transition:.4s;width:max-content;max-width:92vw;text-align:center;pointer-events:none;font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
.big{font-size:clamp(34px,5vw,56px);font-weight:900;color:var(--mint2);line-height:1}
canvas#cert{display:none}
@media (max-width:860px){
 #shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:8px;padding:8px}
 #rail{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:4px;align-items:center;padding:2px 0}
 #rail img.lg{display:none}
 .st{width:auto;padding:5px;flex:none}.st span{display:none}.st.cur span{display:inline;font-size:13px}.st.cur{padding:4px 10px 4px 5px}
 #panel{border-radius:22px}
 .g3,.g4{grid-template-columns:1fr 1fr}.bk{grid-template-columns:1fr 1fr}.bk.b3{grid-template-columns:1fr}
 .mtr{grid-template-columns:96px 1fr 38px}
 .vig .bear{float:none;display:block;margin:0 auto 6px;height:96px}
 .pause .heart{font-size:32px}
 #top .ttl{font-size:11px}
 .hud b{padding:4px 9px;font-size:13px}
 .btn{padding:12px 18px}
}
@media (max-width:520px){.g2{grid-template-columns:1fr}.g3,.g4{grid-template-columns:1fr}.mt{gap:8px}.two{gap:8px}}
@media (max-height:520px) and (orientation:landscape){#shell{grid-template-columns:1fr}#rail{display:none}}

#nav small{white-space:nowrap}
@media (max-width:420px){.btn{padding:11px 14px;font-size:15px}#nav{gap:6px}}
</style></head><body><canvas id="bg"></canvas><div class="toast" id="toast"></div>
